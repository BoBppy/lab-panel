# /etc/lab/containers.conf — defaults for per-user containers (applied when a container is (re)created).
# Per-user overrides (MEMORY, CPUS, GPU) live in /etc/lab/users/<name>.conf and are edited from the panel.
# podman (recommended): each person's container runs in its own user namespace, so root inside it is an
# unprivileged host uid that owns nothing. docker: simpler, but root inside is root on the host's files.
RUNTIME=podman
IMAGE=lab/devbox:latest
# Default memory cap per person (a ceiling, not a reservation). Empty = no limit.
MEMORY=24g
SHM=8g
CPUS=
PIDS=8192
# Extra bind mounts for every container ("host:container[:ro]").
# Example: "/srv/share:/srv/share" gives everyone a common folder.
SHARED_MOUNTS=(
)
